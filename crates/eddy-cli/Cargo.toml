[package]
name = "eddy-cli"
description = "Command-line tool for developing and testing eddy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "eddy"
path = "src/main.rs"

[dependencies]
eddy-core.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Lets the tests run `eddy resolve` against recorded responses (`EDDY_REPLAY`).
eddy-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
