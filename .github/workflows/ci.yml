name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (tags can be moved); Dependabot updates them.
jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Known vulnerabilities in dependencies (RustSec). Fails on vulnerabilities;
  # "unmaintained" notices are reported as warnings.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  app:
    runs-on: macos-latest
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: scripts/test-app.sh
      - run: scripts/build-app.sh
      - run: scripts/check-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eddy-macos
          path: dist/*.zip
